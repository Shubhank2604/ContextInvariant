[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "context-invariant"
version = "0.5.0"
description = "Constraint-preserving context construction for stateful LLM agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shubhank Chandak" }]
keywords = ["llm", "context-management", "agents", "token-budget", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26,<2.5",
    "pydantic>=2,<3",
    "tiktoken>=0.7",
    "typer>=0.12",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3"]
openai = ["openai>=1"]
benchmark = [
    "datasets>=3,<4",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "scipy>=1.11",
]
dev = [
    "hypothesis>=6",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
context-invariant = "context_invariant.cli:app"

[project.urls]
Homepage = "https://github.com/Shubhank2604/ContextInvariant"
Repository = "https://github.com/Shubhank2604/ContextInvariant"
Issues = "https://github.com/Shubhank2604/ContextInvariant/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
context_invariant = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --basetemp=.pytest-tmp --cov=context_invariant --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["context_invariant"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    '\.\.\.',
    "raise NotImplementedError",
]
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["ContextOS_MASTER_BUILD_PROMPT.md", "MASTER_BUILD_SPEC.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/context_invariant/models.py" = ["UP042"]
"tests/**" = ["S101"]
